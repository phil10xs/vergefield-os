services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vergefield
    ports:
      - "5433:5432"
    volumes:
      - vergefield_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vergefield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vergefield_pg:
